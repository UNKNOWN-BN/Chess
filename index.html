<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>Noor Chess Deluxe</title>

  <style>
    :root {
      --bg-1: #0b1020;
      --bg-2: #101b2b;
      --panel: rgba(17, 24, 39, 0.9);
      --panel-soft: rgba(30, 41, 59, 0.92);
      --text: #edf6ff;
      --muted: #9fb8d1;
      --primary: #7c3aed;
      --primary-2: #22d3ee;
      --accent: #facc15;
      --board-light: #f4d7ad;
      --board-dark: #7a8f63;
      --board-dark-2: #5f744a;
      --shadow: rgba(0,0,0,0.28);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      height: 100%;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(124,58,237,0.28), transparent 30%),
        radial-gradient(circle at bottom right, rgba(34,211,238,0.25), transparent 28%),
        linear-gradient(145deg, var(--bg-1), var(--bg-2));
      color: var(--text);
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: max(16px, env(safe-area-inset-top)) 12px max(16px, env(safe-area-inset-bottom));
    }

    .game {
      width: min(100%, 560px);
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid rgba(148, 163, 184, 0.18);
      box-shadow: 0 10px 24px rgba(0,0,0,0.2);
    }

    h1 {
      margin: 0;
      font-size: clamp(22px, 6vw, 32px);
      letter-spacing: 0.02em;
      font-weight: 800;
      background: linear-gradient(90deg, #e2e8f0, #a5b4fc, #67e8f9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #dbeafe;
      background: linear-gradient(90deg, rgba(124,58,237,0.9), rgba(34,211,238,0.9));
      padding: 7px 10px;
      border-radius: 999px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
    }

    #status {
      min-height: 46px;
      display: grid;
      place-items: center;
      text-align: center;
      margin-bottom: 12px;
      padding: 10px 14px;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(30,41,59,0.95), rgba(15,23,42,0.95));
      border: 1px solid rgba(148,163,184,0.18);
      box-shadow: 0 12px 24px rgba(0,0,0,0.18);
      font-weight: 800;
      color: #ecfeff;
    }

    #board {
      width: 100%;
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(8, minmax(0, 1fr));
      overflow: hidden;
      border-radius: 18px;
      border: 4px solid rgba(15, 23, 42, 0.85);
      box-shadow:
        0 22px 40px rgba(2, 6, 23, 0.56),
        inset 0 0 0 2px rgba(255,255,255,0.08);
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
    }

    .square {
      position: relative;
      display: grid;
      place-items: center;
      min-width: 0;
      border: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: transform 0.12s ease;
    }

    .square.light { background: linear-gradient(135deg, #f8dfb5, var(--board-light)); }
    .square.dark  { background: linear-gradient(135deg, var(--board-dark-2), var(--board-dark)); }

    .selected {
      box-shadow: inset 0 0 0 4px var(--accent);
      z-index: 2;
    }

    .last-move {
      background-image:
        linear-gradient(rgba(250, 204, 21, 0.4), rgba(250, 204, 21, 0.4));
    }

    .in-check {
      background-image:
        radial-gradient(circle, rgba(239,68,68,0.8) 0%, rgba(239,68,68,0.45) 35%, rgba(239,68,68,0.15) 52%, transparent 65%);
    }

    .piece {
      z-index: 1;
      font-family: "Segoe UI Symbol", "DejaVu Sans", serif;
      font-size: clamp(30px, 9vw, 62px);
      line-height: 1;
      pointer-events: none;
      transform: translateY(-2px);
      text-shadow: 0 2px 5px rgba(0,0,0,0.28);
    }

    .white-piece {
      color: #ffffff;
      -webkit-text-stroke: 1px rgba(55,65,81,0.9);
    }

    .black-piece {
      color: #111827;
      -webkit-text-stroke: 1px rgba(255,255,255,0.35);
    }

    .legal-dot {
      position: absolute;
      width: 24%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(17, 24, 39, 0.28);
      pointer-events: none;
    }

    .legal-capture {
      position: absolute;
      inset: 4px;
      border: 4px solid rgba(17, 24, 39, 0.35);
      border-radius: 50%;
      pointer-events: none;
    }

    .coordinate {
      position: absolute;
      bottom: 1px;
      left: 4px;
      font-size: clamp(8px, 2vw, 12px);
      font-weight: 800;
      color: rgba(15,23,42,0.7);
      pointer-events: none;
    }

    .square.dark .coordinate {
      color: rgba(255,255,255,0.6);
    }

    .controls {
      display: flex;
      gap: 10px;
      margin-top: 12px;
    }

    .control {
      flex: 1;
      min-height: 46px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, rgba(124,58,237,0.92), rgba(34,211,238,0.82));
      color: white;
      font: inherit;
      font-weight: 800;
      letter-spacing: 0.02em;
      box-shadow: 0 12px 20px rgba(34, 211, 238, 0.24);
      transition: transform 0.12s ease, box-shadow 0.12s ease;
      touch-action: manipulation;
    }

    .control:active {
      transform: translateY(1px);
      box-shadow: 0 8px 15px rgba(124,58,237,0.2);
    }

    #promotion {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      place-items: center;
      background: rgba(2, 6, 23, 0.68);
      backdrop-filter: blur(4px);
      padding: 16px;
    }

    #promotion.show {
      display: grid;
    }

    .promotion-box {
      width: min(100%, 340px);
      border-radius: 18px;
      padding: 18px 16px 16px;
      background: linear-gradient(180deg, rgba(15,23,42,0.98), rgba(17,24,39,0.98));
      border: 1px solid rgba(148,163,184,0.18);
      box-shadow: 0 18px 40px rgba(0,0,0,0.35);
      text-align: center;
    }

    .promotion-box strong {
      display: block;
      margin-bottom: 16px;
      font-size: 18px;
      color: #e2e8f0;
    }

    .promotion-options {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    .promotion-options button {
      min-height: 60px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #1d4ed8, #7c3aed);
      color: white;
      font-size: 36px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
    }

    @media (max-height: 560px) and (orientation: landscape) {
      body { padding-top: 8px; padding-bottom: 8px; }
      .game { width: min(70vh, 500px); }
      .topbar { margin-bottom: 8px; }
      #status { min-height: 34px; margin-bottom: 8px; }
      .control { min-height: 38px; }
    }
  </style>
</head>

<body>
  <main class="game">
    <div class="topbar">
      <h1>♟ Noor Chess</h1>
      <span class="badge">imbiplob01@gmail.com</span>
    </div>

    <div id="status" aria-live="polite">Game loading...</div>
    <div id="board" aria-label="Chess board"></div>

    <div class="controls">
      <button class="control" id="undo" type="button">↶ Undo</button>
      <button class="control" id="reset" type="button">New Game</button>
      <button class="control" id="flip" type="button">Flip</button>
    </div>
  </main>

  <div id="promotion" role="dialog" aria-modal="true">
    <div class="promotion-box">
      <strong>Choose promotion</strong>
      <div id="promotion-options" class="promotion-options"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script>
    (() => {
      const boardEl = document.getElementById("board");
      const statusEl = document.getElementById("status");
      const promotionEl = document.getElementById("promotion");
      const promotionOptions = document.getElementById("promotion-options");

      if (typeof Chess === "undefined") {
        statusEl.textContent = "Could not load chess.js. Please check internet connection.";
        return;
      }

      const game = new Chess();
      const files = "abcdefgh";
      const symbols = {
        wk: "♔", wq: "♕", wr: "♖", wb: "♗", wn: "♘", wp: "♙",
        bk: "♚", bq: "♛", br: "♜", bb: "♝", bn: "♞", bp: "♟"
      };
      const pieceValues = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

      let selected = null;
      let legalMoves = [];
      let flipped = false;
      let promotionTarget = null;
      let robotThinking = false;
      let gameVersion = 0;

      function render() {
        boardEl.innerHTML = "";
        const position = game.board();
        const history = game.history({ verbose: true });
        const lastMove = history.length ? history[history.length - 1] : null;

        for (let displayRow = 0; displayRow < 8; displayRow++) {
          for (let displayCol = 0; displayCol < 8; displayCol++) {
            const row = flipped ? 7 - displayRow : displayRow;
            const col = flipped ? 7 - displayCol : displayCol;
            const squareName = files[col] + (8 - row);
            const piece = position[row][col];
            const cell = document.createElement("button");

            cell.type = "button";
            cell.className = "square " + ((row + col) % 2 ? "dark" : "light");
            if (selected === squareName) cell.classList.add("selected");
            if (lastMove && (lastMove.from === squareName || lastMove.to === squareName)) {
              cell.classList.add("last-move");
            }

            if (piece) {
              const pieceEl = document.createElement("span");
              pieceEl.className = "piece " + (piece.color === "w" ? "white-piece" : "black-piece");
              pieceEl.textContent = symbols[piece.color + piece.type];
              cell.appendChild(pieceEl);

              if (piece.type === "k" && piece.color === game.turn() && game.in_check()) {
                cell.classList.add("in-check");
              }
            }

            const move = legalMoves.find(item => item.to === squareName);
            if (move) {
              const marker = document.createElement("span");
              marker.className = (move.flags.includes("c") || move.flags.includes("e"))
                ? "legal-capture"
                : "legal-dot";
              cell.appendChild(marker);
            }

            if (displayCol === 0 || displayRow === 7) {
              const coord = document.createElement("span");
              coord.className = "coordinate";
              coord.textContent = displayCol === 0 ? 8 - row : files[col];
              cell.appendChild(coord);
            }

            cell.setAttribute("aria-label", squareName);
            cell.addEventListener("click", () => onSquareClick(squareName));
            boardEl.appendChild(cell);
          }
        }

        updateStatus();
      }

      function updateStatus() {
        if (game.in_checkmate()) {
          statusEl.textContent = game.turn() === "w"
            ? "Checkmate! Robot wins."
            : "Checkmate! You win.";
        } else if (game.in_stalemate()) {
          statusEl.textContent = "Draw by stalemate.";
        } else if (game.in_draw()) {
          statusEl.textContent = "Draw game.";
        } else if (robotThinking) {
          statusEl.textContent = "Robot is thinking...";
        } else if (game.in_check()) {
          statusEl.textContent = game.turn() === "w" ? "Your move — check!" : "Robot is in check!";
        } else {
          statusEl.textContent = game.turn() === "w" ? "Your move — White" : "Robot turn — Black";
        }
      }

      function onSquareClick(squareName) {
        if (game.game_over() || robotThinking || game.turn() !== "w" || promotionTarget) {
          return;
        }

        if (selected) {
          const move = legalMoves.find(item => item.to === squareName);
          if (move) {
            if (move.flags.includes("p")) {
              openPromotion(squareName);
              return;
            }
            makeMove(squareName);
            return;
          }
        }

        const piece = game.get(squareName);
        if (piece && piece.color === "w") {
          selected = squareName;
          legalMoves = game.moves({ square: squareName, verbose: true });
        } else {
          selected = null;
          legalMoves = [];
        }

        render();
      }

      function makeMove(to, promotion = "q") {
        try {
          game.move({ from: selected, to, promotion });
          selected = null;
          legalMoves = [];
          render();
          startRobot();
        } catch (error) {
          selected = null;
          legalMoves = [];
          render();
        }
      }

      function openPromotion(to) {
        promotionTarget = to;
        promotionOptions.innerHTML = "";

        ["q", "r", "b", "n"].forEach(type => {
          const button = document.createElement("button");
          button.type = "button";
          button.textContent = symbols["w" + type];
          button.setAttribute("aria-label", "Promote to " + type);
          button.addEventListener("click", () => {
            const destination = promotionTarget;
            promotionTarget = null;
            promotionEl.classList.remove("show");
            makeMove(destination, type);
          });
          promotionOptions.appendChild(button);
        });

        promotionEl.classList.add("show");
      }

      function evaluatePosition() {
        if (game.in_checkmate()) {
          return game.turn() === "w" ? -100000 : 100000;
        }
        if (game.in_draw()) return 0;

        let score = 0;
        const board = game.board();

        for (let row = 0; row < 8; row++) {
          for (let col = 0; col < 8; col++) {
            const piece = board[row][col];
            if (!piece) continue;

            const side = piece.color === "w" ? 1 : -1;
            score += side * pieceValues[piece.type];

            const centerDist = Math.abs(3.5 - row) + Math.abs(3.5 - col);
            if (["p", "n", "b"].includes(piece.type)) {
              score += side * (7 - centerDist) * 3;
            }
          }
        }

        return score;
      }

      function minimax(depth, alpha, beta) {
        if (depth === 0 || game.game_over()) {
          return evaluatePosition();
        }

        const moves = game.moves({ verbose: true });
        const maximizing = game.turn() === "w";

        if (maximizing) {
          let best = -Infinity;
          for (const move of moves) {
            game.move(move);
            const score = minimax(depth - 1, alpha, beta);
            game.undo();
            best = Math.max(best, score);
            alpha = Math.max(alpha, best);
            if (beta <= alpha) break;
          }
          return best;
        } else {
          let best = Infinity;
          for (const move of moves) {
            game.move(move);
            const score = minimax(depth - 1, alpha, beta);
            game.undo();
            best = Math.min(best, score);
            beta = Math.min(beta, best);
            if (beta <= alpha) break;
          }
          return best;
        }
      }

      function chooseRobotMove() {
        const legal = game.moves({ verbose: true });
        let bestScore = Infinity;
        let choices = [];

        for (const move of legal) {
          game.move(move);
          const score = minimax(2, -Infinity, Infinity);
          game.undo();

          if (score < bestScore) {
            bestScore = score;
            choices = [move];
          } else if (score === bestScore) {
            choices.push(move);
          }
        }

        return choices[Math.floor(Math.random() * choices.length)];
      }

      function startRobot() {
        if (game.game_over() || game.turn() !== "b") return;

        robotThinking = true;
        render();

        const currentVersion = gameVersion;

        setTimeout(() => {
          if (currentVersion !== gameVersion || game.game_over() || game.turn() !== "b") return;

          const move = chooseRobotMove();
          if (!move) return;

          game.move(move);
          robotThinking = false;
          render();
        }, 250);
      }

      document.getElementById("undo").addEventListener("click", () => {
        gameVersion++;
        robotThinking = false;
        promotionTarget = null;
        promotionEl.classList.remove("show");

        if (game.history().length) {
          game.undo();
          if (game.turn() === "b") game.undo();
        }

        selected = null;
        legalMoves = [];
        render();
      });

      document.getElementById("reset").addEventListener("click", () => {
        gameVersion++;
        game.reset();
        robotThinking = false;
        promotionTarget = null;
        promotionEl.classList.remove("show");
        selected = null;
        legalMoves = [];
        render();
      });

      document.getElementById("flip").addEventListener("click", () => {
        flipped = !flipped;
        render();
      });

      render();
    })();
  </script>
</body>
</html>
